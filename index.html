<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pavitra Rajpal</title>
<meta name="description" content="Pavitra Rajpal — digital strategy student, digital ad sales, guitar covers. Where data meets instinct." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Inter:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css?v=v3" />
<script>document.documentElement.className = "js";</script>
</head>
<body>

<!-- site.js fills this with drifting petals; remove it to switch them off -->
<div class="petals" aria-hidden="true"></div>

<main class="home">
  <div class="stage">

    <!-- centre: handwritten hello + typed line -->
    <h1 class="signature">hi! i&rsquo;m pavitra! <span class="lily-mark"></span></h1>
    <p class="tagline" data-greet data-type="click around to learn about me:)"></p>

    <!-- 1 · film strip → stills -->
    <a class="pin" href="stills.html" style="--rot:-19deg; --delay:.05s; left:52px; top:14px;" aria-label="Stills">
      <span class="film">
        <span class="slot" data-ph="film"><img src="photos/life1.jpg" alt="" /></span>
        <span class="slot" data-ph="film"><img src="photos/life2.jpg" alt="" /></span>
        <span class="slot" data-ph="film"><img src="photos/life3.jpg" alt="" /></span>
        <span class="slot" data-ph="film"><img src="photos/life4.jpg" alt="" /></span>
        <span class="pin__tag">stills</span>
      </span>
    </a>

    <!-- 2 · notebook + pen → projects -->
    <a class="pin" href="projects.html" style="--rot:-27deg; --delay:.12s; right:36px; top:46px;" aria-label="Projects">
      <span class="note-obj">
        <span class="notebook"><span class="pen"></span></span>
        <span class="pin__tag">projects</span>
      </span>
    </a>

    <!-- 3 · sticky note → email -->
    <a class="pin" data-contact="email" href="mailto:hello@pavitrarajpal.com" style="--rot:-7deg; --delay:.19s; left:322px; top:34px;" aria-label="Email me">
      <span class="sticky">
        <span class="hand">say hi!</span>
        <span class="sub">email me</span>
        <span class="pin__tag">email me</span>
      </span>
    </a>

    <!-- 4 · record sleeve → music  (was a second link to interests) -->
    <a class="pin" href="music.html" style="--rot:8deg; --delay:.26s; right:332px; top:62px;" aria-label="Music">
      <span class="record">
        <span class="record__disc"></span>
        <span class="record__sleeve"><span class="record__play"></span></span>
        <span class="pin__tag">music</span>
      </span>
    </a>

    <!-- 9 · coffee mug → work -->
    <a class="pin" href="work.html" style="--rot:-4deg; --delay:.60s; left:486px; top:556px;" aria-label="Work">
      <span class="mug">
        <span class="mug__steam"></span>
        <span class="mug__cup"><span class="mug__handle"></span></span>
        <span class="pin__tag">what i do</span>
      </span>
    </a>

    <!-- decorative: a coffee ring stained into the paper, and a guitar pick -->
    <span class="ring" style="left:496px; top:100px; --r:80px;" aria-hidden="true"></span>
    <span class="ring" style="left:846px; top:612px; --r:64px;" aria-hidden="true"></span>

    <span class="pick" style="position:absolute; left:262px; top:646px; transform:rotate(-16deg);" aria-hidden="true">
      <svg viewBox="-36 -38 72 76" xmlns="http://www.w3.org/2000/svg">
        <path d="M-30 -14 C-30 -29 -16 -34 0 -34 C16 -34 30 -29 30 -14 C30 7 10 31 0 34 C-10 31 -30 7 -30 -14Z"
              fill="#f3c4d2" stroke="#cf6382" stroke-width="3.2" stroke-linejoin="round" />
        <g stroke="#cf6382" stroke-width="1.8" opacity="0.55">
          <path d="M-17 -16 h34" /><path d="M-15 -5 h30" /><path d="M-11 6 h22" />
        </g>
      </svg>
    </span>

    <!-- 5 · polaroid → about me -->
    <a class="pin" href="about.html" style="--rot:8deg; --delay:.33s; left:30px; top:430px;" aria-label="About me">
      <span class="polaroid">
        <span class="slot" data-ph="portrait"><img src="photos/portrait.jpg" alt="" /></span>
        <span class="polaroid__cap">me :)</span>
        <span class="pin__tag">about me</span>
      </span>
    </a>

    <!-- 6 · phone → socials -->
    <a class="pin" href="socials.html" style="--rot:4deg; --delay:.40s; left:336px; top:488px;" aria-label="Socials">
      <span class="phone">
        <span class="phone__screen">
          <span class="glyph">&#9829;</span>
          <span class="cap">socials</span>
        </span>
        <span class="pin__tag">socials</span>
      </span>
    </a>

    <!-- 7 · paper stack → professional -->
    <a class="pin" href="professional.html" style="--rot:-6deg; --delay:.47s; right:236px; top:440px;" aria-label="Professional">
      <span class="papers">
        <span class="clip"></span>
        <span class="sheet"><span class="ruled"></span></span>
        <!-- the cat, asleep on the paperwork, as cats are -->
        <span class="cat" aria-hidden="true">
          <svg viewBox="0 0 130 72" xmlns="http://www.w3.org/2000/svg">
            <path d="M112 64 C126 64 130 48 118 42" stroke="#2b2430" stroke-width="8" fill="none" stroke-linecap="round" />
            <path d="M22 24 L15 3 L40 15Z" fill="#2b2430" />
            <path d="M98 24 L105 3 L80 15Z" fill="#2b2430" />
            <path d="M8 64 C8 32 30 15 60 15 C90 15 112 32 112 64Z" fill="#2b2430" />
            <ellipse class="cat__eye" cx="46" cy="37" rx="5.4" ry="6.6" fill="#7cc98d" />
            <ellipse class="cat__eye" cx="74" cy="37" rx="5.4" ry="6.6" fill="#7cc98d" />
            <ellipse cx="46" cy="37" rx="1.7" ry="5.6" fill="#1d2b1c" />
            <ellipse cx="74" cy="37" rx="1.7" ry="5.6" fill="#1d2b1c" />
            <path d="M60 47 l-4.5 5 h9Z" fill="#cf6382" />
          </svg>
        </span>
        <span class="pin__tag">professional</span>
      </span>
    </a>

    <!-- 8 · pressed stargazer lily, taped to the page → interests -->
    <a class="pin" href="interests.html" style="--rot:5deg; --delay:.54s; right:14px; top:300px;" aria-label="Interests">
      <span class="pressed">
        <span class="pressed__tape pressed__tape--a"></span>
        <span class="pressed__tape pressed__tape--b"></span>
        <span class="pressed__lily">
          <svg viewBox="-50 -54 100 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pressed stargazer lily">
            <path d="M2 52 C-2 34 -5 18 -1 2" stroke="#8a9a6b" stroke-width="2.2" fill="none" stroke-linecap="round" />
            <path d="M1 30 C-12 26 -18 16 -19 8 C-9 9 -1 18 1 30 Z" fill="#cfdcbe" stroke="#8a9a6b" stroke-width="1.2" />
            <g fill="#f0b8c8" fill-opacity="0.92" stroke="#c9587a" stroke-width="1.3" stroke-linejoin="round">
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" />
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" transform="rotate(60)" />
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" transform="rotate(120)" />
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" transform="rotate(180)" />
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" transform="rotate(240)" />
              <path d="M0 0C9-10 11-26 0-44C-11-26-9-10 0 0Z" transform="rotate(300)" />
            </g>
            <g fill="#c9587a" fill-opacity="0.55">
              <circle cx="-3" cy="-16" r="1.1" /><circle cx="4" cy="-23" r="1.1" />
              <circle cx="-6" cy="-27" r="1.1" /><circle cx="14" cy="-9" r="1.1" />
              <circle cx="-15" cy="-8" r="1.1" /><circle cx="9" cy="14" r="1.1" />
              <circle cx="-11" cy="12" r="1.1" /><circle cx="0" cy="19" r="1.1" />
            </g>
            <g stroke="#7d3a52" stroke-width="1.1" stroke-linecap="round">
              <path d="M0 0L-12-18" /><path d="M0 0L12-18" /><path d="M0 0L0-22" />
              <path d="M0 0L-17-9" /><path d="M0 0L17-9" />
            </g>
            <g fill="#a4623c">
              <ellipse cx="-12" cy="-18" rx="2.7" ry="1.6" transform="rotate(-30 -12 -18)" />
              <ellipse cx="12" cy="-18" rx="2.7" ry="1.6" transform="rotate(30 12 -18)" />
              <ellipse cx="0" cy="-22" rx="2.7" ry="1.6" />
              <ellipse cx="-17" cy="-9" rx="2.7" ry="1.6" transform="rotate(-60 -17 -9)" />
              <ellipse cx="17" cy="-9" rx="2.7" ry="1.6" transform="rotate(60 17 -9)" />
            </g>
            <circle cx="0" cy="0" r="2.6" fill="#c9587a" />
          </svg>
        </span>
        <span class="pressed__label">Lilium &lsquo;Stargazer&rsquo;<em>pressed &middot; mumbai, 2026</em></span>
        <span class="pin__tag">interests</span>
      </span>
    </a>

  </div>
</main>

<script src="assets/site.js?v=v3"></script>
</body>
</html>
