<main class="page">
  <h1 class="page-title">stills</h1>
  <p class="page-sub">a few frames i&rsquo;ve kept &mdash; the city, the work, and the people in between.</p>

  <div class="stills" style="margin-top:46px;">
    <figure class="shot" style="--rot:-2.5deg; --ar:1 / 1.28;">
      <div class="slot" data-ph="a moment"><img src="photos/life1.jpg" alt="city days" /></div>
      <figcaption class="cap">city days</figcaption>
    </figure>
    <figure class="shot" style="--rot:1.8deg; --ar:1 / 0.72;">
      <div class="slot" data-ph="work"><img src="photos/work1.jpg" alt="on set" /></div>
      <figcaption class="cap">on set</figcaption>
    </figure>
    <figure class="shot" style="--rot:2.2deg; --ar:1 / 1;">
      <div class="slot" data-ph="a moment"><img src="photos/life2.jpg" alt="golden hour" /></div>
      <figcaption class="cap">golden hour</figcaption>
    </figure>
    <figure class="shot" style="--rot:-1.6deg; --ar:1 / 1.24;">
      <div class="slot" data-ph="a moment"><img src="photos/life3.jpg" alt="sunday" /></div>
      <figcaption class="cap">sunday</figcaption>
    </figure>
    <figure class="shot" style="--rot:1.4deg; --ar:1 / 0.78;">
      <div class="slot" data-ph="work"><img src="photos/work2.jpg" alt="campaign day" /></div>
      <figcaption class="cap">campaign day</figcaption>
    </figure>
    <figure class="shot" style="--rot:-2.1deg; --ar:1 / 1;">
      <div class="slot" data-ph="a moment"><img src="photos/life4.jpg" alt="the crew" /></div>
      <figcaption class="cap">the crew</figcaption>
    </figure>
    <figure class="shot" style="--rot:2deg; --ar:1 / 1.3;">
      <div class="slot" data-ph="work"><img src="photos/work3.jpg" alt="backstage" /></div>
      <figcaption class="cap">backstage</figcaption>
    </figure>
    <figure class="shot" style="--rot:-1.4deg; --ar:1 / 1.18;">
      <div class="slot" data-ph="portrait"><img src="photos/portrait.jpg" alt="me :)" /></div>
      <figcaption class="cap">me :)</figcaption>
    </figure>
  </div>
